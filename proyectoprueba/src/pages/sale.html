<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sale</title>
    <style>
      .top-bar {
        background-color: #000;
        color: #fff;
        text-align: center;
        padding: 10px;
      }

      ul {
        list-style: none;
      }

      .site-header {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        padding: 12px 20px;
      }

      .site-title {
        grid-column: 1;
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 24px;
        line-height: 1.1;
      }

      .nav-links {
        grid-column: 2;
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 12px;
        padding: 14px;
        background-color: #fff;
      }

      .nav-links a {
        padding: 8px 12px;
        color: #222;
        font-family: Georgia, "Times New Roman", serif;
        text-decoration: none;
        border-bottom: 2px solid transparent;
        transition:
          color 0.2s ease,
          border-color 0.2s ease;
      }

      .nav-links a:hover,
      .nav-links a.active {
        color: #ff69b4;
        border-bottom-color: #ff69b4;
      }

      .nav-links a:focus-visible {
        outline: 2px solid #ff69b4;
        outline-offset: 3px;
      }

      @media (max-width: 600px) {
        .site-header {
          grid-template-columns: 1fr;
          gap: 8px;
          padding: 12px;
        }

        .site-title,
        .nav-links {
          grid-column: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="top-bar">ENVIO GRATIS EN COMPRAS SUPERIORES A $20.000</div>
    <header class="site-header">
      <h1 class="site-title">Accesorios<br />Arona</h1>
      <nav class="nav-links" aria-label="Navegación principal">
        <a href="./index arona.html">Inicio</a>
        <a href="./novedades.html">Novedades</a>
        <a href="./servicios.html">Servicios</a>
        <a href="./contacto.html">Contacto</a>
        <a href="./sale.html" class="sale-link active" aria-current="page"
          >Sale %</a
        >
      </nav>
    </header>
  </body>
</html>
